<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{title}</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #7f5af0;
            --success: #2cb67d;
            --border: #444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        a { color: var(--success); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
        }
        .nav a { color: var(--text-secondary); margin-right: 1rem; font-size: 0.9rem; }
        .nav a:hover { color: var(--text-primary); }
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .content h1, .content h2, .content h3 {
            color: var(--accent);
            margin: 1.5rem 0 0.75rem;
        }
        .content h1:first-child, .content h2:first-child { margin-top: 0; }
        .content h1 { font-size: 2rem; }
        .content h2 { font-size: 1.5rem; }
        .content h3 { font-size: 1.2rem; }
        .content p { margin-bottom: 1rem; }
        .content code {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .content pre {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .content pre code { background: none; padding: 0; }
        .content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .content th, .content td {
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        .content th { background: var(--bg-secondary); }
        .content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .content ul, .content ol { margin-bottom: 1rem; padding-left: 2rem; }
        .content img { max-width: 100%; border-radius: 6px; }
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    {nav}
    <div class="content">
        {body}
    </div>
    <div class="footer">Powered by OpenHost + Tor</div>
</body>
</html>
